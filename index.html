    <title>Pasula Shloka | Portfolio</title>
    <!-- GitHub Pages Single Page App routing redirect handler -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <script>
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '/Portfolio-new/assets/index.css';
        document.head.appendChild(link);
      }
    </script>
    <script type="module" crossorigin src="/Portfolio-new/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/Portfolio-new/assets/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        var s = document.createElement('script');
        s.type = 'module';
        s.src = '/Portfolio-new/assets/index.js';
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
